name: Deploy YBrary to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.9.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Build public site
        run: pnpm build
        env:
          VITE_BASE_PATH: /y-brary/
          VITE_SITE_URL: https://didxodnr0769-bom.github.io
          VITE_ENABLE_INDEXING: "false"
      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
